<div class="duo-holder" [style]="'gap:' + flexGap + ';'" appElementContainerDirective>

    <div class="duo-right-holder" appElementItemDirective [style]="'max-width: ' + rightMaxWidth">
        <h3 (click)="mobileShowRight.set(!mobileShowRight())" class="expand_header">
            <img 
                [class.rotate-expanded]="mobileShowRight()"
                id="exp1" 
                class="expand_icon expand_i_reg rotate" src="assets/Less_than.png">
            {{ mainText }}
        </h3>

        <div class="translate" [class.translate-expanded]="mobileShowRight()">

            <ng-content select="right-content"></ng-content>

        </div>
    </div>
    <div class="duo-left-holder" appElementItemDirective [style]="'min-width: ' + minWIdth + '; max-width: ' + leftMaxWidth">

        <ng-content></ng-content>

    </div>
</div>
